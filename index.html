<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b70">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Contagem de insumos</title>
<style>
:root{--bg:#fff;--ink:#1a1f24;--muted:#6b7580;--line:#e6e9ec;--soft:#f4f6f8;--accent:#0a6b70;--accent-soft:#e3f1f1;--ok:#23804a;--ok-soft:#e3f2e8;--err:#b3261e;--err-soft:#fbe9e7;--warn:#9a6516;--warn-soft:#fbf0dc;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#121518;--ink:#e8ecef;--muted:#9aa4ad;--line:#262c31;--soft:#1b2024;--accent:#4fbdb8;--accent-soft:#16302f;--ok:#5cc486;--ok-soft:#173325;--err:#f08b83;--err-soft:#3a1c1a;--warn:#e0a84a;--warn-soft:#3a2d15;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.wide{max-width:900px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.bar1 h1{flex:1;margin:0;font-size:19px;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar1 input[type=date]{border:0;background:var(--soft);border-radius:8px;padding:7px 8px;font-size:15px;min-height:38px;max-width:150px}
.me{border:0;background:var(--soft);border-radius:999px;min-height:38px;padding:0 12px;font-size:14px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:8;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu small{display:block;padding:6px 12px 8px;color:var(--muted)}
.deps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.deps::-webkit-scrollbar{display:none}
.dep{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 13px;font-size:15px;color:var(--muted);white-space:nowrap}
.dep span{font-size:13px;margin-left:5px;font-variant-numeric:tabular-nums}
.dep[aria-selected=true]{background:var(--ink);color:var(--bg)}
.dep.full span{color:var(--ok)}
.dep[aria-selected=true].full span{color:inherit}
.find{display:flex;gap:8px;padding-bottom:10px}
.find input,.find select{flex:1;border:0;background:var(--soft);border-radius:8px;padding:9px 12px;min-height:40px;min-width:0}
.find button{border:0;background:var(--soft);border-radius:8px;padding:0 12px;min-height:40px;color:var(--muted)}
.find button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
ul{list-style:none;margin:0;padding:0 0 120px}
li.it{padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.txt{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:550;line-height:1.25;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sub .ok{color:var(--ok)} .sub .pend{color:var(--warn)}
.in{display:flex;align-items:center;gap:6px}
.in input{width:112px;text-align:right;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:46px}
.in input:focus{border-color:var(--accent);outline:none}
li.done .in input{border-color:var(--ok)}
li.waiting .in input{border-color:var(--warn);border-style:dashed}
li.flash .in input{background:var(--accent-soft)}
.u{font-size:12px;color:var(--muted);width:30px}
.x{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0 0;text-decoration:underline;text-underline-offset:2px}
.vol{display:none;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:10px;font-variant-numeric:tabular-nums}
li.multi .vol{display:flex}
.vol input{width:80px;text-align:right;font-size:17px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:40px}
.vol .eq{margin-left:auto;font-weight:600}
.vol small{color:var(--muted)}
.none{color:var(--muted);text-align:center;padding:40px 16px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
footer .wrap{display:flex;align-items:center;gap:12px}
.prog{flex:1;font-size:13.5px;color:var(--muted);line-height:1.3;min-width:0}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.live.busy{background:var(--warn)} .live.off{background:var(--err)}
.send{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px}
@media (prefers-color-scheme: dark){.send{color:#0b1f1f}}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:9px 14px;min-height:42px}
.danger{color:var(--err)}

/* entrada */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:min(100%,380px)}
.card h1{font-size:24px;margin:0 0 4px}
.card p{color:var(--muted);margin:0 0 18px}
label{display:block;font-size:14px;margin:12px 0 4px}
.field{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px 12px;min-height:44px}
.msg{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
.card .send{width:100%;margin-top:14px}

/* administração */
.seg{display:flex;gap:4px;padding-bottom:10px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;color:var(--muted);font-size:15px}
.seg button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.users{padding:6px 0 40px}
.user{border-bottom:1px solid var(--line);padding:14px 0}
.uh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.uh b{font-size:16px}
.uh .lg{color:var(--muted);font-size:13.5px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.b-on{background:var(--ok-soft);color:var(--ok)} .b-off{background:var(--err-soft);color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.uacts{display:flex;gap:8px;flex-wrap:wrap}
.uacts button{font-size:14px;min-height:38px;padding:6px 12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 4px;flex-wrap:wrap}
.toolbar p{margin:0;color:var(--muted);font-size:14px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:10px}
@media (min-width:640px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.filters select{border:0;background:var(--soft);border-radius:8px;padding:9px 10px;min-height:40px;min-width:0}
.log{padding:4px 0 40px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ev time{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .who{font-weight:600}
.ev .what{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.ev .val{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:650;border-radius:6px;padding:1px 7px;margin:0 4px}
.t-contou{background:var(--ok-soft);color:var(--ok)} .t-alterou{background:var(--warn-soft);color:var(--warn)}
.t-apagou{background:var(--err-soft);color:var(--err)} .t-descartado{background:var(--warn-soft);color:var(--warn)} .t-recusado{background:var(--err-soft);color:var(--err)} .t-usuario,.t-entrou{background:var(--soft);color:var(--muted)}
.dayhead{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 0 4px}

dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,440px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 4px;font-size:18px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
.toast.on{display:block}
</style>
</head>
<body>

<!-- ENTRADA -->
<section id="vLogin" class="center" hidden>
  <div class="card">
    <h1>Contagem de insumos</h1>
    <p>Entre com o usuário e a senha que você recebeu.</p>
    <label for="lgUser">Usuário</label>
    <input id="lgUser" class="field" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="lgPass">Senha</label>
    <input id="lgPass" class="field" type="password" autocomplete="current-password">
    <button class="send" id="lgBtn">Entrar</button>
    <div class="msg" id="lgMsg"></div>
  </div>
</section>

<!-- CONTAGEM -->
<section id="vCount" hidden>
  <header>
    <div class="wrap">
      <div class="bar1">
        <h1>Contagem</h1>
        <input type="date" id="date" aria-label="Data da contagem">
        <button class="me" id="meBtn" aria-haspopup="menu"></button>
      </div>
      <div class="deps" id="deps" role="tablist"></div>
      <div class="find">
        <input type="search" id="q" placeholder="Buscar insumo ou código" autocomplete="off">
        <button id="pend" aria-pressed="false">Faltam</button>
      </div>
    </div>
  </header>
  <main class="wrap"><ul id="list"></ul></main>
  <footer>
    <div class="wrap">
      <div class="prog"><div><span class="live busy" id="live"></span><span id="liveTxt">Conectando…</span></div><div id="prog"></div></div>
      <button class="send" id="dlBtn" hidden>Baixar do dia</button>
    </div>
  </footer>
</section>

<!-- ADMINISTRAÇÃO -->
<section id="vAdmin" hidden>
  <header>
    <div class="wrap wide">
      <div class="bar1">
        <button class="ghost" id="backBtn" aria-label="Voltar para a contagem">← Contagem</button>
        <h1>Administração</h1>
      </div>
      <div class="seg" role="tablist">
        <button role="tab" id="tabUsers" aria-selected="true">Usuários</button>
        <button role="tab" id="tabLog" aria-selected="false">Relatório</button>
      </div>
    </div>
  </header>
  <main class="wrap wide">
    <div id="pUsers">
      <div class="toolbar"><p id="usersInfo"></p><button class="send" id="newUserBtn">Novo usuário</button></div>
      <div class="users" id="users"></div>
    </div>
    <div id="pLog" hidden>
      <div class="toolbar"><p>Movimentações dos últimos 5 dias. Registros mais antigos são apagados automaticamente.</p><button class="ghost" id="logCsv">Baixar relatório</button></div>
      <div class="filters">
        <select id="fDia" aria-label="Dia"></select>
        <select id="fUser" aria-label="Usuário"></select>
        <select id="fDep" aria-label="Setor"></select>
        <select id="fAcao" aria-label="Ação">
          <option value="">Todas as ações</option><option value="contou">Contou</option><option value="alterou">Alterou</option>
          <option value="apagou">Apagou</option><option value="descartado">Não usado (conflito sem sinal)</option><option value="usuario">Usuários e acessos</option><option value="entrou">Entradas no sistema</option><option value="recusado">Logins recusados</option>
        </select>
      </div>
      <div class="log" id="log"></div>
    </div>
  </main>
</section>

<div class="menu" id="menu" role="menu" hidden>
  <small id="menuWho"></small>
  <button role="menuitem" id="mAdmin" hidden>Administração</button>
  <button role="menuitem" id="mOut">Sair</button>
</div>

<dialog id="dlgUser">
  <h2 id="duTitle">Novo usuário</h2>
  <label for="duNome">Nome</label><input id="duNome" class="field" autocomplete="off">
  <label for="duLogin">Usuário (para entrar)</label><input id="duLogin" class="field" autocapitalize="off" spellcheck="false" placeholder="ex.: joao.silva">
  <label for="duSenha" id="duSenhaLbl">Senha inicial</label><input id="duSenha" class="field" autocomplete="new-password" placeholder="mínimo 4 caracteres">
  <label>Setores liberados</label>
  <div class="chips" id="duDeps"></div>
  <div class="msg" id="duMsg"></div>
  <div class="acts"><button class="ghost" id="duCancel">Cancelar</button><button class="send" id="duSave">Salvar</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

/* ---------- servidor ---------- */
async function api(path, method, params, body){
  const url='/api/'+path+(params?'?'+new URLSearchParams(params):'');
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),12000);
  let r;
  try{ r=await fetch(url,{method, headers:{'Authorization':'Bearer '+S.token,'Content-Type':'application/json'}, body:body?JSON.stringify(body):undefined, cache:'no-store', signal:ctl.signal}); }
  catch(e){ const x=new Error('sem conexão'); x.status=0; x.code='rede'; throw x; }
  finally{ clearTimeout(tm); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&(j.msg||j.erro))||('HTTP '+r.status)); e.status=r.status; e.code=j&&j.erro; e.ap=j&&j.ap; throw e; }
  return j;
}
function authFail(e){
  if(e.status===401 && e.code==='encerrada'){ logout('O administrador encerrou sua sessão neste aparelho. Entre de novo se precisar.',true); return true; }
  if(e.status===401 && e.code==='outra_sessao'){ logout('Sua conta foi aberta em outro aparelho'+(e.ap?' ('+e.ap+')':'')+'. Esta sessão foi encerrada.',true); return true; }
  if(e.status===401){ logout('Sua sessão terminou. Entre de novo.',true); return true; }
  if(e.status===403 && e.code==='bloqueado'){ logout('Seu acesso foi bloqueado. Fale com o administrador.'); return true; }
  return false;
}
function applyPerfil(p){
  if(!p) return;

  if(before!==JSON.stringify(p)){ renderMe(); if(S.view==='count') build(); }
}

let pollT=null, pollBusy=false;
async function poll(){
  if(pollBusy || !S.token || S.view!=='count') return;
  pollBusy=true; const date=S.date;
  try{
    await flush();
    const params={data:date}; if(S.ver!=null) params.v=S.ver;
    const j=await api('contagem','GET',params);
    applyPerfil(j.perfil);
    if(date!==S.date) return;
    if(j.itens){ const before=S.remote; S.remote=j.itens; S.ver=j.v; cacheRemote(); applyRemote(before); } else S.ver=j.v;
    S.online=true; const np=nPend();
    setLive(np?'busy':'', np?('Enviando '+np+' item(s)…'):'Ao vivo · atualizado '+hora(Date.now()));
    if(S.wasOff){ S.wasOff=false; nodes.forEach(li=>li._sync()); }
  }catch(e){
    if(authFail(e)) return;
    if(e.code==='configuracao') setLive('off','Servidor sem configuração');
    else { S.online=false; S.wasOff=true; const np=nPend();
      setLive('off','Sem sinal · '+(np?np+' contagem(ns) guardada(s) neste aparelho':'o que você digitar fica guardado')); nodes.forEach(li=>li._sync()); }
  }finally{ pollBusy=false; }
}
function schedule(){ clearInterval(pollT); pollT=setInterval(()=>{ if(!document.hidden) poll(); }, POLL_MS); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
window.addEventListener('online',()=>poll());
window.addEventListener('offline',()=>{ S.online=false; S.wasOff=true; setLive('off','Sem sinal · o que você digitar fica guardado'); });

async function flush(){
  if(S.sending) return;
  const dates=Object.keys(S.pending).filter(d=>Object.keys(S.pending[d]).length);
  if(!dates.length) return;
  S.sending=true;
  try{
    for(const d of dates){
      const batch={...S.pending[d]};
      let j;
      try{ j=await api('contagem','POST',null,{data:d, itens:batch}); }
      catch(e){
        if(e.status===403 && e.code==='setor'){ // setor retirado: não há como enviar
          Object.keys(batch).forEach(k=>{ if(!S.me.deps.includes(k.split(':')[0])) delete S.pending[d][k]; });
          savePending(); toast('Um setor foi retirado do seu acesso. As contagens dele não puderam ser enviadas.'); continue;
        }
        throw e;
      }
      const cur=S.pending[d]||{};
      Object.keys(batch).forEach(k=>{ if(JSON.stringify(cur[k])===JSON.stringify(batch[k])) delete cur[k]; });
      if(!Object.keys(cur).length) delete S.pending[d];
      savePending();
      if(j && j.ignorados && j.ignorados.length) toast(j.ignorados.length+' contagem(ns) feita(s) sem sinal não foram usadas: outra pessoa atualizou o mesmo item depois. Veja no relatório.');
      if(d===S.date) S.ver=null;
    }
  } finally { S.sending=false; }
}
function put(key, v){
  const rec = v===null ? {tc:Date.now(), vazio:true} : {...v, by:S.me.nome, tc:Date.now()};
  (S.pending[S.date] ||= {})[key]=rec;
  savePending();
  if(S.online) setLive('busy','Enviando…'); else setLive('off','Sem sinal · '+nPend()+' contagem(ns) guardada(s) neste aparelho');
  clearTimeout(put.t); put.t=setTimeout(poll,400);
  tabs();
}

    pw.onclick=async()=>{ const s=prompt('Nova senha para '+u.nome+' (mínimo 4 caracteres):'); if(s==null) return;
      if(s.length<4){ toast('A senha precisa ter pelo menos 4 caracteres'); return; }
      if(await saveUser({login:u.login,senha:s})) toast('Senha trocada. '+u.nome+' vai precisar entrar de novo.'); };
    const ed=el('button','ghost','Renomear');
    ed.onclick=async()=>{ const n=prompt('Nome de '+u.login+':',u.nome); if(n&&n.trim()&&n.trim()!==u.nome) saveUser({login:u.login,nome:n.trim()}); };
    const del=el('button','ghost danger','Excluir');
    del.onclick=async()=>{ if(!confirm('Excluir o usuário '+u.nome+'? As contagens que ele já fez continuam salvas.')) return;
      try{ await api('admin','POST',null,{acao:'excluir',login:u.login}); S.users=S.users.filter(x=>x.login!==u.login); renderUsers(); toast('Usuário excluído'); }
      catch(e){ if(!authFail(e)) toast(e.message); } };
    const enc=el('button','ghost','Encerrar sessão'); enc.hidden=!u.online;
    enc.onclick=async()=>{ if(!confirm('Desconectar '+u.nome+' do aparelho em uso agora?')) return; enc.disabled=true;
      try{ const j=await api('admin','POST',null,{acao:'encerrar',login:u.login}); const i=S.users.findIndex(x=>x.login===u.login); S.users[i]={...j.usuario,online:null}; renderUsers(); toast('Sessão encerrada. '+u.nome+' já pode entrar em outro aparelho.'); }
      catch(e){ if(!authFail(e)) toast(e.message); enc.disabled=false; } };
    acts.append(enc,bl,pw,ed,del);
    c.append(h,st,chips,acts); box.append(c);
  });
}
const duDeps=new Set();
$('#newUserBtn').onclick=()=>{
  duDeps.clear(); ['duNome','duLogin','duSenha'].forEach(i=>$('#'+i).value=''); $('#duMsg').textContent='';
  const box=$('#duDeps'); box.innerHTML='';
  DEPS.forEach(d=>{ const b=el('button','chip',d.nome); b.type='button'; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{ duDeps.has(d.id)?duDeps.delete(d.id):duDeps.add(d.id); b.setAttribute('aria-pressed',duDeps.has(d.id)); }; box.append(b); });
  $('#dlgUser').showModal(); $('#duNome').focus();
};
$('#duNome').addEventListener('input',()=>{ if($('#duLogin').dataset.touched) return;
  const p=$('#duNome').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/\s+/).filter(Boolean);
  $('#duLogin').value=p.length>1?p[0]+'.'+p[p.length-1]:(p[0]||''); });
$('#duLogin').addEventListener('input',()=>$('#duLogin').dataset.touched='1');
$('#duCancel').onclick=()=>$('#dlgUser').close();
$('#duSave').onclick=async()=>{
  const nome=$('#duNome').value.trim(), login=$('#duLogin').value.trim().toLowerCase(), senha=$('#duSenha').value;
  if(!nome){ $('#duMsg').textContent='Informe o nome.'; return; }
  if(!/^[a-z0-9._-]{3,30}$/.test(login)){ $('#duMsg').textContent='Usuário: 3 a 30 letras minúsculas, números, ponto ou hífen, sem espaço nem acento.'; return; }
  if(senha.length<4){ $('#duMsg').textContent='A senha precisa ter pelo menos 4 caracteres.'; return; }
  $('#duSave').disabled=true;
  try{ const j=await api('admin','POST',null,{acao:'salvar',criar:true,login,nome,senha,deps:DEPS.map(d=>d.id).filter(d=>duDeps.has(d)),ativo:true});
    S.users.push(j.usuario); S.users.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')); renderUsers(); $('#dlgUser').close(); delete $('#duLogin').dataset.touched;
    toast('Usuário criado. Envie a ele o usuário "'+login+'" e a senha.'); }
  catch(e){ if(!authFail(e)) $('#duMsg').textContent=e.message; }
  finally{ $('#duSave').disabled=false; }
};

/* ---------- administração: relatório ---------- */
S.log=[]; S.logDias=[];
const ACAO={contou:'contou',alterou:'alterou',apagou:'apagou',descartado:'não usado',usuario:'usuários',entrou:'entrou',recusado:'login recusado'};
async function loadLog(){
  $('#log').textContent='Carregando…';
  try{ const j=await api('admin','GET',{acao:'relatorio'}); S.log=j.eventos; S.logDias=j.dias; fillFilters(); renderLog(); }
  catch(e){ if(!authFail(e)) $('#log').textContent='Não foi possível carregar o relatório.'; }
}
const diaEv=t=>dstr(new Date(t));
function fillFilters(){
  const keep=id=>$(id).value;
  const fd=keep('#fDia'), fu=keep('#fUser'), fp=keep('#fDep');
  $('#fDia').innerHTML=''; $('#fDia').append(new Option('Últimos 5 dias',''));
  S.logDias.forEach(d=>$('#fDia').append(new Option(br(d),d)));
  $('#fUser').innerHTML=''; $('#fUser').append(new Option('Todos os usuários',''));
  [...new Map(S.log.map(e=>[e.u,e.nome])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'pt-BR')).forEach(([u,n])=>$('#fUser').append(new Option(n+' ('+u+')',u)));
  $('#fDep').innerHTML=''; $('#fDep').append(new Option('Todos os setores',''));
  DEPS.forEach(d=>$('#fDep').append(new Option(d.nome,d.id)));
  $('#fDia').value=fd; $('#fUser').value=fu; $('#fDep').value=fp;
}
['#fDia','#fUser','#fDep','#fAcao'].forEach(s=>$(s).addEventListener('change',renderLog));
function filtered(){
  const d=$('#fDia').value, u=$('#fUser').value, p=$('#fDep').value, a=$('#fAcao').value;
  return S.log.filter(e=>(!d||diaEv(e.t)===d)&&(!u||e.u===u)&&(!p||(e.k&&e.k.startsWith(p+':')))&&(!a||e.acao===a));
}
const vtxt=r=>r?fmt(r.total)+(r.m?' ('+fmt(r.q)+'×'+fmt(r.m)+')':''):'—';
function renderLog(){
  const box=$('#log'); box.innerHTML='';
  const evs=filtered();
  if(!evs.length){ box.append(el('p','none','Nenhuma movimentação encontrada com esses filtros.')); return; }
  let lastDay='';
  evs.forEach(e=>{
    const d=diaEv(e.t);
    if(d!==lastDay){ lastDay=d; box.append(el('div','dayhead',new Date(e.t).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}))); }
    const r=el('div','ev'); const t=el('time',null,hora(e.t)); t.dateTime=new Date(e.t).toISOString();
    const body=el('div');
    const line=el('div'); line.append(el('span','who',e.nome||e.u), el('span','tag t-'+e.acao, ACAO[e.acao]||e.acao));
    if(e.k){ const it=ITEM[e.k]; line.append(el('span',null,it?it.nome:e.k));
      const w=el('div','what'); w.append((DEPNOME[e.k.split(':')[0]]||'')+' · contagem de '+br(e.data)+' · ');
      w.append(el('span','val',e.acao==='descartado'?('mantido '+vtxt(e.antes)+' · não usado '+vtxt(e.depois)+(it?' '+it.und:'')):(vtxt(e.antes)+' → '+vtxt(e.depois)+(it?' '+it.und:''))));
      if(e.acao!=='contou' && e.antes && e.antes.by && e.antes.by!==e.nome) w.append(' · antes contado por '+e.antes.by);
      body.append(line,w);
      const extra=[e.detalhe, e.obs?(e.obs+(e.tc?' (digitado às '+hora(e.tc)+')':'')):''].filter(Boolean).join(' · ');
      if(extra) body.append(el('div','what',extra));
    } else { body.append(line); if(e.detalhe) body.append(el('div','what',e.detalhe)); }
    r.append(t,body); box.append(r);
  });
}
$('#logCsv').onclick=()=>{
  const evs=filtered(); if(!evs.length){ toast('Nada para baixar com esses filtros'); return; }
  const out=['DATA_HORA;USUARIO;NOME;ACAO;SETOR;CODIGO;INSUMO;DATA_CONTAGEM;ANTES;DEPOIS;DETALHE;DIGITADO_EM'];
  evs.forEach(e=>{ const it=e.k?ITEM[e.k]:null;
    out.push([new Date(e.t).toLocaleString('pt-BR'),e.u,clean(e.nome),e.acao,e.k?DEPNOME[e.k.split(':')[0]]:'',it?it.cod:'',clean(it?it.nome:''),e.data?br(e.data):'',
      e.antes?String(round(e.antes.total)).replace('.',','):'',e.depois?String(round(e.depois.total)).replace('.',','):'',clean([e.detalhe,e.obs].filter(Boolean).join(' · ')),e.tc?new Date(e.tc).toLocaleString('pt-BR'):''].join(';')); });
  download('relatorio_movimentacoes_'+today()+'.csv',out);
};

window.addEventListener('pagehide',()=>{ if(S.token && S.me && !S.me.admin && !nPend()) sair(S.token,true); });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
/* ---------- início ---------- */
$('#date').value=S.date;
$('#date').onchange=e=>{ if(!e.target.value) return; S.date=e.target.value; loadRemoteCache(); S.ver=null; build(); poll(); };
$('#q').oninput=e=>{ S.q=e.target.value; build(); };
$('#pend').onclick=()=>{ S.pend=!S.pend; $('#pend').setAttribute('aria-pressed',S.pend); build(); };
$('#lgUser').value=ls.get('ultimoLogin','');
if(S.token && S.me) show('count'); else show('login');
