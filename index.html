<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Contagem de insumos</title>
<style>
:root{--bg:#fff;--ink:#1a1f24;--muted:#6b7580;--line:#e6e9ec;--soft:#f4f6f8;--accent:#0a6b70;--accent-soft:#e3f1f1;--ok:#23804a;--err:#b3261e;--warn:#9a6516;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#121518;--ink:#e8ecef;--muted:#9aa4ad;--line:#262c31;--soft:#1b2024;--accent:#4fbdb8;--accent-soft:#16302f;--ok:#5cc486;--err:#f08b83;--warn:#e0a84a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.bar1 h1{flex:1;margin:0;font-size:19px;font-weight:650}
.bar1 input[type=date]{border:0;background:var(--soft);border-radius:8px;padding:7px 10px;font-size:15px;min-height:38px}
.deps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.deps::-webkit-scrollbar{display:none}
.dep{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 13px;font-size:15px;color:var(--muted);white-space:nowrap}
.dep span{font-size:13px;margin-left:5px;font-variant-numeric:tabular-nums}
.dep[aria-selected=true]{background:var(--ink);color:var(--bg)}
.dep.full span{color:var(--ok)}
.dep[aria-selected=true].full span{color:inherit}
.find{display:flex;gap:8px;padding-bottom:10px}
.find input{flex:1;border:0;background:var(--soft);border-radius:8px;padding:9px 12px;min-height:40px}
.find button{border:0;background:var(--soft);border-radius:8px;padding:0 12px;min-height:40px;color:var(--muted)}
.find button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
ul{list-style:none;margin:0;padding:0 0 120px}
li.it{padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.txt{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:550;line-height:1.25;overflow-wrap:anywhere}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sub .ok{color:var(--ok)} .sub .pend{color:var(--warn)}
.in{display:flex;align-items:center;gap:6px}
.in input{width:112px;text-align:right;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:46px}
.in input:focus{border-color:var(--accent);outline:none}
li.done .in input{border-color:var(--ok)}
li.flash .in input{background:var(--accent-soft)}
.u{font-size:12px;color:var(--muted);width:30px}
.x{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0 0;text-decoration:underline;text-underline-offset:2px}
.vol{display:none;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:10px;font-variant-numeric:tabular-nums}
li.multi .vol{display:flex}
.vol input{width:80px;text-align:right;font-size:17px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:40px}
.vol .eq{margin-left:auto;font-weight:600}
.vol small{color:var(--muted)}
.none{color:var(--muted);text-align:center;padding:40px 0}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
footer .wrap{display:flex;align-items:center;gap:12px}
.prog{flex:1;font-size:13.5px;color:var(--muted);line-height:1.3}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.live.busy{background:var(--warn)} .live.off{background:var(--err)}
.send{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px}
@media (prefers-color-scheme: dark){.send{color:#0b1f1f}}
.ghost{border:1px solid var(--line);background:none;border-radius:10px;padding:10px 14px;min-height:44px}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 6px;font-size:18px}
dialog p{margin:6px 0 12px;color:var(--muted);font-size:14.5px}
dialog label{display:block;font-size:14px;margin:10px 0 4px}
dialog input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px 12px;min-height:44px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.msg{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90vw}
.toast.on{display:block}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar1">
      <h1>Contagem</h1>
      <input type="date" id="date" aria-label="Data da contagem">
    </div>
    <div class="deps" id="deps" role="tablist"></div>
    <div class="find">
      <input type="search" id="q" placeholder="Buscar insumo ou código" autocomplete="off">
      <button id="pend" aria-pressed="false">Faltam</button>
    </div>
  </div>
</header>
<main class="wrap"><ul id="list"></ul></main>
<footer>
  <div class="wrap">
    <div class="prog"><div><span class="live busy" id="live"></span><span id="liveTxt">Conectando…</span></div><div id="prog"></div></div>
    <button class="send" id="dlBtn">Baixar do dia</button>
  </div>
</footer>

<dialog id="login">
  <h2>Entrar na contagem</h2>
  <p>Use o código de acesso que a equipe recebeu.</p>
  <label for="code">Código de acesso</label>
  <input id="code" autocomplete="off" autocapitalize="off">
  <label for="who">Seu nome</label>
  <input id="who" autocomplete="name" placeholder="Aparece para a equipe nos itens que você contar">
  <div class="msg" id="loginMsg"></div>
  <div class="acts"><button class="send" id="loginBtn">Entrar</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const CAT = {"ALMOX":[[2,"72000066737","SOLUCAO NITRO NS 8160","KG",1100],[3,"72000062266","DISCO INTERNO ONDULADO SIMPLES 980MM","PEÇ",630],[4,"72000066735","SOLUCAO PHOS PS 8110","KG",1250],[5,"72000038886","BENTONITA FENNOSOL BP KEMIRA","KG",null],[6,"72000038890","ALVEJANTE OTICO PARA MP","KG",1100],[7,"72000000087","CAL HIDRATADA CALCITICA CH1 - ETE","KG",null],[8,"72000061784","PAPEL KRAFT  KPE 186+13g/m² LARG.1250MM","KG",940],[9,"72000064076","DISCO INTERNO ONDULADO DIAMETRO 1250MM","PEÇ",630],[10,"72000061094","SOLUCAO FOSFATADA DAG P 1500","KG",1100],[11,"72000066216","CORANTE CASTANHO SIDER 1280 BOX","KG",null],[12,"72000063436","SULFATO ACIDIFICADO (COAGULANTE) NB 8045","KG",1200],[13,"72000059968","INIBIDOR DE CORROSAO PARA AGUA S373","KG",1200],[14,"72000029948","SOLUCAO LIMPEZA DE FELTRO/TELA CONN 5131","KG",1075],[15,"72000065650","PAPEL KRAFT  KPE 186+13g/m²  LARG.1100MM","KG",700],[16,"72000065506","LIMPADOR ALCALINO CONN 5132 LI","KG",1075],[17,"72000066594","CORANTE VERMELHO SIDER DYE 1114 SM","KG",null],[18,"72000039746","FLOCULANTE ETE 8989","KG",null],[19,"72000038875","FLOCULANTE MP FENNOPOL K7426P KEMIRA","KG",1000],[20,"72000066570","CHAPA PAPELAO ONDULADO SDP 2350 X 1200","PEÇ",185],[21,"72000066728","TUBETE KRAFT D.I. 101,6 X 2610 MM ESP12","PEÇ",88],[22,"72000065643","TUBETE KRAFT D.I. 101,6 X 3900 MM ESP12","PEÇ",88],[23,"72000065102","CORANTE VERDE BYK CARTAZINE","KG",null],[24,"72000066707","PALLET MADEIRA FECHADO 1200 X 1200MM","PEÇ",null],[25,"72000036067","INIBIDOR INCRUSTRACAO P/TORRE 673","KG",null],[26,"72000059967","INIBIDOR CORROSAO OXM601 KURITA","KG",null],[27,"72000000307","SEQUESTRANTE DE OXIGENIO A4070","KG",50],[28,"72000060828","ANTI INCRUSTANTE LX-1090 - KURITA","KG",60],[29,"72000039246","DISPERSANTE P/ TRATAMENTO DE AGUA BC 501","KG",null],[30,"72000065098","ANTIESPUMANTE SIDERTECH AE 2501","TO",1],[31,"72000036066","BIOCIDA 651","KG",5],[32,"72000066203","POLIMERO - NALCO 61950","TO",1.068],[33,"72000066072","DISPERSANTE - NALCO 64218","TO",1.083],[34,"72000055135","ANTIESPUMANTE MP 52AT/AFRANIL MTC/1400","TO",null],[35,"72000066070","COAGULANTE NALCO 2","TO",null],[36,"72000048397","POLIMERO LICOR A3050 KEMIRA","TO",null],[37,"72000065309","AGENTE DE RESISTENCIA FENNOBOND 3300 SA","TO",null],[38,"72000034277","POLICLORETO DE ALUMINIO 800HT-ETA/ETE/MP","KG",1390],[39,"72000062249","DISCO INTERNO ONDULADO DIAMETRO 1110MM","PEÇ",630],[40,"72000065746","CHAPA PAPELAO ONDA SIMPLES 1000 X 1000","PEÇ",500],[41,"72000029947","SOLUCAO LIMPEZA TELA SECADORA CONN3097","KG",1075],[42,"72000066679","ERRO NA CONSULTA SAP","",null],[43,"72000066680","ERRO NA CONSULTA SAP","",null],[44,"73300039156","TUBETE KRAFT D.I. 101,6 X 2820 MM ESP12","PEÇ",null],[45,"72000066672","TUBETE KRAFT D.I. 101,6 X 2520 MM ESP12","PEÇ",null]],"ETE":[[2,"72000066070","COAGULANTE NALCO 2","TO",null],[3,"72000000088","UREIA TECNICA","KG",null],[4,"72000064798","POLICLORETO DE ALUMINIO - MP/ETE","KG",null],[5,"72000062225","SOLUCAO NITROGENADA - DAG 2000","KG",null],[6,"72000000087","CAL HIDRATADA CALCITICA CH1 - ETE","KG",null],[7,"72000055135","ANTIESPUMANTE MP 52AT/AFRANIL MTC/1400","TO",null],[8,"72000039746","FLOCULANTE ETE 8989","KG",null],[9,"72000066737","SOLUCAO NITRO NS 8160","KG",null],[10,"72000066735","SOLUCAO PHOS PS 8110","KG",null],[11,"72000034277","POLICLORETO DE ALUMINIO 800HT-ETA/ETE/MP","KG",null],[12,"72000048397","POLIMERO LICOR A3050 KEMIRA","TO",null]],"TMP":[[2,"72000066740","POLICLORETO DE ALUMINIO - POLIFER 180 HX","KG",null],[3,"PI21350","BISSULFITO DE SODIO","KG",null],[4,"72000000037","HIDROSSULFITO SODIO PO.","KG",null],[5,"72000036067","INIBIDOR INCRUSTRACAO P/TORRE 673","KG",null],[6,"72000066070","COAGULANTE NALCO 2","TO",null],[7,"72000065098","ANTIESPUMANTE SIDERTECH AE 2501","TO",null],[8,"72000048397","POLIMERO LICOR A3050 KEMIRA","TO",null],[9,"72000038888","BENTONITA NAO BRANQUEADA","KG",null],[10,"72000063734","BENTONITA BRANQUEADA FENNOLITE WHITE SA","KG",null],[11,"72000061334","SODA CAUSTICA LIQUIDA","TOD",null],[12,"72000038886","BENTONITA FENNOSOL BP KEMIRA","KG",null]],"MAQUINA":[[2,"72000066070","COAGULANTE NALCO 2","TO",null],[3,"72000064738","AGENTE DE COLAGEM COLA ASA AS2000","TO",null],[4,"72000065309","AGENTE DE RESISTENCIA FENNOBOND 3300 SA","TO",null],[5,"72000038890","ALVEJANTE OTICO PARA MP","KG",null],[6,"72000039021","AMIDO CATIONICO DE MANDIOCA - MAQ PAPEL","TO",null],[7,"72000064739","AUXILIAR DE COLAGEM  PROMOTER E350","TO",null],[8,"72000066600","CASTANHO SIDER DYE 1120 FLEX","TO",null],[9,"72000061329","CELULOSE FL NACIONAL KLABIN","KG",null],[10,"72000000090","CLORETO DE SODIO","KG",null],[11,"72000038873","COAGULANTE  FENNOFIX 57 KEMIRA","KG",null],[12,"72000064889","CORANTE CASTANHO CARTAZINE","KG",null],[13,"72000066216","CORANTE CASTANHO SIDER 1280 BOX","KG",null],[14,"72000065102","CORANTE VERDE BYK CARTAZINE","KG",null],[15,"72000065101","CORANTE VERMELHO BK CARTAZINE","KG",null],[16,"72000066594","CORANTE VERMELHO SIDER DYE 1114 SM","KG",null],[17,"PI26","CORANTE VIOLETA","KG",null],[18,"72000066706","CORANTE VIOLETA SIDER DYE 1240","KG",null],[19,"72000038875","FLOCULANTE MP FENNOPOL K7426P KEMIRA","KG",null],[20,"72000048257","HIPOCLORITO DE SODIO FENNOCIDE 145","TO",null],[21,"72000065506","LIMPADOR ALCALINO CONN 5132 LI","KG",null],[22,"72000029948","SOLUCAO LIMPEZA DE FELTRO/TELA CONN 5131","KG",null],[23,"72000029947","SOLUCAO LIMPEZA TELA SECADORA CONN3097","KG",null],[24,"72000034277","POLICLORETO DE ALUMINIO 800HT-ETA/ETE/MP","KG",null],[25,"72000055135","ANTIESPUMANTE MP 52AT/AFRANIL MTC/1400","TO",null]],"EMBALAGEM":[[2,"72000066709","FITA ADES TRANSP C/ LOGO BOPAPER 72X100","FUN",null],[3,"72000065643","TUBETE KRAFT D.I. 101,6 X 3900 MM ESP12","PEÇ",null],[4,"72000063597","TUBETE KRAFT  D.I. 76,5 X 4240MM ESP12","PEÇ",null],[5,"72000066730","TUBETE KRAFT D.I. 101,6 X 2220 MM ESP12","PEÇ",null],[6,"72000061784","PAPEL KRAFT  KPE 186+13g/m² LARG.1250MM","KG",null],[7,"72000064076","DISCO INTERNO ONDULADO DIAMETRO 1250MM","PEÇ",null],[8,"72000066728","TUBETE KRAFT D.I. 101,6 X 2610 MM ESP12","PEÇ",null]]};
const DEPS = [
  {id:'ALMOX', aba:'STK ALMOX', nome:'Almoxarifado', dep:'3002'},
  {id:'ETE', aba:'STK ETE', nome:'ETE', dep:'B115'},
  {id:'TMP', aba:'STK TMP', nome:'TMP', dep:'3018'},
  {id:'MAQUINA', aba:'STK MAQUINA', nome:'Máquina', dep:'3020'},
  {id:'EMBALAGEM', aba:'STK EMBALAGEM', nome:'Embalagem', dep:'3023'}
];
const API = '/api/contagem';
const POLL_MS = 5000;
const $=s=>document.querySelector(s);
const fmt=(n,d=3)=>(n==null||isNaN(n))?'':Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d});
const round=n=>Math.round(n*1e6)/1e6;
function num(s){ if(s==null) return null; s=String(s).trim().replace(/\s/g,''); if(!s) return null;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(',','.');
  const n=Number(s); return isFinite(n)&&n>=0?n:NaN; }
const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
const br=s=>s.split('-').reverse().join('/');
const hora=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800);}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={date:today(), dep:ls.get('dep','ALMOX'), q:'', pend:false,
  code:ls.get('codigo',''), who:ls.get('who',''), remote:{}, ver:null,
  pending:ls.get('pendentes',{}), sending:false, online:false};
if(!DEPS.some(d=>d.id===S.dep)) S.dep='ALMOX';
const K=(dep,row)=>dep+':r'+row;
const has=v=>!!(v&&v.total!=null&&!isNaN(v.total));
function val(key){ const p=S.pending[S.date]; if(p && key in p) return p[key]; return S.remote[key]; }
const nDone=id=>CAT[id].filter(it=>has(val(K(id,it[0])))).length;
function setLive(kind,txt){ const l=$('#live'); l.className='live'+(kind?' '+kind:''); $('#liveTxt').textContent=txt; }

/* ---------- servidor ---------- */
async function api(method, params, body){
  const url = API + (params ? '?' + new URLSearchParams(params) : '');
  const r = await fetch(url,{method, headers:{'x-codigo':S.code,'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined, cache:'no-store'});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error((j&&j.erro)||('HTTP '+r.status)); e.status=r.status; throw e; }
  return j;
}
let pollT=null, pollBusy=false;
async function poll(){
  if(pollBusy || !S.code) return;
  pollBusy=true;
  const date=S.date;
  try{
    await flush();
    const params={data:date}; if(S.ver!=null) params.v=S.ver;
    const j=await api('GET',params);
    if(date!==S.date) return;
    if(j.itens){ const before=S.remote; S.remote=j.itens; S.ver=j.v; applyRemote(before); }
    else S.ver=j.v;
    S.online=true;
    const np=Object.keys(S.pending[S.date]||{}).length;
    setLive(np?'busy':'', np?('Enviando '+np+' item(s)…'):'Ao vivo · atualizado '+hora(Date.now()));
  }catch(e){
    if(e.status===401){ S.code=''; ls.set('codigo',''); openLogin('Código de acesso inválido. Confira com o responsável.'); }
    else if(e.status===500 && e.message==='configuracao') setLive('off','Servidor sem configuração (banco ou código)');
    else setLive('off','Sem conexão. Suas contagens ficam guardadas e serão enviadas.');
    S.online=false;
  }finally{ pollBusy=false; }
}
function schedule(){ clearInterval(pollT); pollT=setInterval(()=>{ if(!document.hidden) poll(); }, POLL_MS); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });

async function flush(){
  if(S.sending) return;
  const dates=Object.keys(S.pending).filter(d=>Object.keys(S.pending[d]).length);
  if(!dates.length) return;
  S.sending=true;
  try{
    for(const d of dates){
      const batch={...S.pending[d]};
      const j=await api('POST',null,{data:d, itens:batch});
      const cur=S.pending[d]||{};
      Object.keys(batch).forEach(k=>{
        if(JSON.stringify(cur[k])===JSON.stringify(batch[k])){
          if(d===S.date){ if(batch[k]===null) delete S.remote[k]; else S.remote[k]={...batch[k],t:Date.now()}; }
          delete cur[k];
        }
      });
      if(!Object.keys(cur).length) delete S.pending[d];
      ls.set('pendentes',S.pending);
      if(d===S.date && j && j.v!=null) S.ver=null; // força recarga completa na próxima leitura
    }
  } finally { S.sending=false; }
}
function put(key, v){
  const rec = v===null ? null : {...v, by:S.who};
  (S.pending[S.date] ||= {})[key]=rec;
  ls.set('pendentes',S.pending);
  setLive('busy','Enviando…');
  clearTimeout(put.t); put.t=setTimeout(poll,400);
  tabs();
}

/* ---------- tela ---------- */
function tabs(){
  const box=$('#deps');
  if(!box.children.length) DEPS.forEach(d=>{
    const b=document.createElement('button'); b.className='dep'; b.setAttribute('role','tab'); b.dataset.id=d.id;
    b.append(d.nome, document.createElement('span'));
    b.onclick=()=>{S.dep=d.id; ls.set('dep',d.id); build(); scrollTo({top:0});};
    box.append(b);
  });
  let all=0,tot=0;
  DEPS.forEach(d=>{
    const b=box.querySelector('[data-id="'+d.id+'"]'), n=nDone(d.id), t=CAT[d.id].length; all+=n; tot+=t;
    b.querySelector('span').textContent=n+'/'+t;
    b.classList.toggle('full',n===t);
    b.setAttribute('aria-selected',d.id===S.dep);
  });
  const d=DEPS.find(x=>x.id===S.dep);
  const p=$('#prog'); p.textContent=''; const b=document.createElement('b'); b.textContent=all+' de '+tot;
  p.append(b,' contados pela equipe · dep. '+d.dep);
}
function match(it){
  if(S.pend && has(val(K(S.dep,it[0])))) return false;
  const q=S.q.trim().toLowerCase(); if(!q) return true;
  return it[2].toLowerCase().includes(q)||String(it[1]).includes(q);
}
const nodes=new Map();
function build(){
  tabs(); nodes.clear();
  const ul=$('#list'); ul.innerHTML='';
  const items=CAT[S.dep].filter(match);
  if(!items.length){ const li=document.createElement('li'); li.className='none';
    li.textContent=S.pend&&!S.q?'Tudo contado neste depósito.':'Nenhum insumo com esse nome ou código.'; ul.append(li); return; }
  items.forEach(it=>{ const li=item(it); nodes.set(K(S.dep,it[0]),li); ul.append(li); });
}
function applyRemote(before){
  tabs();
  nodes.forEach((li,key)=>{
    const a=before[key], b=S.remote[key];
    if(JSON.stringify(a)!==JSON.stringify(b)){
      li._sync();
      if(b && b.by && b.by!==S.who){ li.classList.add('flash'); setTimeout(()=>li.classList.remove('flash'),1500); }
    }
  });
}
function item(it){
  const [row,cod,nome,und,fator]=it, dep=S.dep, key=K(dep,row);
  const li=document.createElement('li'); li.className='it';
  li.innerHTML='<div class="row"><div class="txt"><div class="nm"></div><div class="sub"></div><button class="x" type="button">Contar por volumes</button></div>'+
    '<div class="in"><input class="q" inputmode="decimal" enterkeyhint="next" aria-label="Quantidade"><span class="u"></span></div></div>'+
    '<div class="vol"><input class="v" inputmode="decimal" enterkeyhint="next" aria-label="Volumes"><small>volumes ×</small><input class="f" inputmode="decimal" aria-label="Quantidade por volume"><span class="eq"></span></div>';
  li.querySelector('.nm').textContent=nome;
  li.querySelector('.u').textContent=und;
  const q=li.querySelector('.q'), v=li.querySelector('.v'), f=li.querySelector('.f'), x=li.querySelector('.x'), eq=li.querySelector('.eq');
  const setMulti=on=>{ li.classList.toggle('multi',on); q.readOnly=on; x.textContent=on?'Digitar quantidade direta':'Contar por volumes'; };
  const live=()=>{ const a=num(v.value), b=num(f.value); eq.textContent=(a!=null&&!isNaN(a)&&b!=null&&!isNaN(b))?'= '+fmt(round(a*b))+' '+und:''; };

  li._sync=()=>{
    const cur=val(key), s=li.querySelector('.sub'); s.textContent=cod;
    const pend=S.pending[S.date] && key in S.pending[S.date];
    li.classList.toggle('done',has(cur));
    if(has(cur)){ const o=document.createElement('span'); o.className=pend?'pend':'ok';
      o.textContent = pend ? '  · enviando…' : '  ✓ '+(cur.by||'contado')+(cur.t?' às '+hora(cur.t):''); s.append(o); }
    const a=document.activeElement; if(a===q||a===v||a===f) return;
    if(has(cur)){
      q.value=fmt(cur.total,6);
      if(cur.m){ setMulti(true); v.value=fmt(cur.q,6); f.value=fmt(cur.m,6); live(); }
      else if(li.classList.contains('multi')){ setMulti(false); v.value=''; eq.textContent=''; }
    } else { q.value=''; if(li.classList.contains('multi')){ v.value=''; eq.textContent=''; } }
  };
  if(fator) f.value=fmt(fator,6);
  li._sync();

  q.addEventListener('change',()=>{ const n=num(q.value);
    if(n===null){ put(key,null); return li._sync(); }
    if(isNaN(n)){ toast('Digite só números'); q.value=''; return; }
    q.value=fmt(n,6); put(key,{q:n,m:null,total:n}); li._sync(); });
  const calc=()=>{ const a=num(v.value), b=num(f.value);
    if(a===null){ put(key,null); return li._sync(); }
    if(isNaN(a)||b===null||isNaN(b)){ toast('Informe volumes e quantidade por volume'); return; }
    const t=round(a*b); q.value=fmt(t,6); put(key,{q:a,m:b,total:t}); li._sync(); };
  v.addEventListener('input',live); f.addEventListener('input',live);
  v.addEventListener('change',calc); f.addEventListener('change',calc);
  x.onclick=()=>{ const on=!li.classList.contains('multi'); setMulti(on);
    if(on){ v.focus(); } else { v.value=''; eq.textContent=''; if(has(val(key))&&val(key).m){ q.value=''; put(key,null); li._sync(); } q.focus(); } };
  [q,v].forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); next(li); } }));
  return li;
}
function next(li){ const n=li.nextElementSibling; if(!n||!n.classList.contains('it')) return;
  (n.classList.contains('multi')?n.querySelector('.v'):n.querySelector('.q')).focus(); n.scrollIntoView({block:'center'}); }

/* ---------- arquivo para a macro ---------- */
$('#dlBtn').onclick=async()=>{
  await poll();
  const out=['ABA;CODIGO;LINHA;CONTAGEM;FORMULA;DATA;RESPONSAVEL'];
  const clean=s=>String(s||'').replace(/[;\r\n]/g,' ');
  DEPS.forEach(d=>CAT[d.id].forEach(it=>{ const v=val(K(d.id,it[0])); if(!has(v)) return;
    out.push([d.aba,it[1],it[0],round(v.total),v.m?round(v.q)+'*'+round(v.m):'',br(S.date),clean(v.by)].join(';')); }));
  if(out.length===1){ toast('Nenhum item contado em '+br(S.date)); return; }
  const name='contagem_'+S.date+'.csv';
  const blob=new Blob(['\ufeff'+out.join('\r\n')+'\r\n'],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Arquivo baixado: '+name+' ('+(out.length-1)+' itens)');
};

/* ---------- entrada ---------- */
function openLogin(msg){ $('#code').value=S.code; $('#who').value=S.who; $('#loginMsg').textContent=msg||''; if(!$('#login').open) $('#login').showModal(); }
$('#login').addEventListener('cancel',e=>e.preventDefault());
$('#loginBtn').onclick=async()=>{
  const c=$('#code').value.trim(), w=$('#who').value.trim();
  if(!c){ $('#loginMsg').textContent='Informe o código de acesso.'; return; }
  if(!w){ $('#loginMsg').textContent='Informe seu nome.'; return; }
  S.code=c; S.who=w.slice(0,60);
  $('#loginBtn').disabled=true; $('#loginMsg').textContent='';
  try{ await api('GET',{data:S.date}); ls.set('codigo',S.code); ls.set('who',S.who); $('#login').close(); S.ver=null; poll(); schedule(); }
  catch(e){ $('#loginMsg').textContent = e.status===401 ? 'Código incorreto.' : 'Não foi possível conectar. Verifique a internet e tente de novo.'; S.code=''; }
  finally{ $('#loginBtn').disabled=false; }
};

$('#date').value=S.date;
$('#date').onchange=e=>{ if(!e.target.value) return; S.date=e.target.value; S.remote={}; S.ver=null; build(); poll(); };
$('#q').oninput=e=>{ S.q=e.target.value; build(); };
$('#pend').onclick=()=>{ S.pend=!S.pend; $('#pend').setAttribute('aria-pressed',S.pend); build(); };
build();
if(!S.code||!S.who) openLogin(); else { poll(); schedule(); }
</script>
